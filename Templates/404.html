<!-- ==================== 404.html ==================== -->
{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
    <div class="max-w-md w-full text-center">
        <div class="animate-fade-in">
            <i class="fas fa-exclamation-triangle text-9xl text-yellow-500 mb-6"></i>
            <h1 class="text-6xl font-bold text-gray-800 mb-4">404</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Page Not Found</h2>
            <p class="text-gray-600 mb-8">
                Oops! The page you're looking for doesn't exist or has been moved.
            </p>
            <div class="space-x-4">
                <a href="/dashboard" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition inline-block">
                    <i class="fas fa-home mr-2"></i>Go to Dashboard
                </a>
                <a href="javascript:history.back()" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 transition inline-block">
                    <i class="fas fa-arrow-left mr-2"></i>Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
